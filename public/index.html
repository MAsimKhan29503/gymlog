<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GymLog — Track Every Rep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #1a1a1a;
    --border: #2a2a2a;
    --accent: #e8ff00;
    --accent2: #ff4d00;
    --text: #f0f0f0;
    --muted: #666;
    --success: #00ff88;
    --card-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─── */
  header {
    background: var(--bg2);
    border-bottom: 3px solid var(--accent);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 2rem;
    letter-spacing: -1px;
    color: var(--accent);
    text-transform: uppercase;
  }
  .logo span { color: var(--text); }

  nav { display: flex; gap: 0; }
  nav button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 0 1.2rem;
    height: 64px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -3px;
    transition: color .2s, border-color .2s;
  }
  nav button:hover { color: var(--text); }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ─── LAYOUT ─── */
  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  .page { display: none; }
  .page.active { display: block; }

  /* ─── STATS BAR ─── */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 2.5rem;
    border-radius: 4px;
    overflow: hidden;
  }
  .stat-item {
    background: var(--bg2);
    padding: 1.2rem 1rem;
    text-align: center;
  }
  .stat-item .val {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 2.2rem;
    color: var(--accent);
    line-height: 1;
  }
  .stat-item .lbl {
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ─── SECTION TITLE ─── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 2rem;
    text-transform: uppercase;
    letter-spacing: -0.5px;
  }
  .section-title span { color: var(--accent); }

  /* ─── BUTTONS ─── */
  .btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 0.55rem 1.4rem;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { opacity: .88; }
  .btn-danger { background: var(--accent2); color: #fff; }
  .btn-danger:hover { opacity: .85; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-ghost:hover { border-color: var(--text); color: var(--text); }
  .btn-sm { font-size: 0.8rem; padding: 0.35rem 0.9rem; }

  /* ─── WORKOUT CARDS ─── */
  .workouts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem;
  }

  .workout-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.4rem;
    cursor: pointer;
    transition: border-color .2s, transform .15s;
    position: relative;
    overflow: hidden;
  }
  .workout-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform .2s;
    transform-origin: bottom;
  }
  .workout-card:hover { border-color: #444; transform: translateY(-2px); }
  .workout-card:hover::before { transform: scaleY(1); }

  .workout-card .wc-date {
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  .workout-card .wc-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    line-height: 1.1;
  }
  .workout-card .wc-muscles {
    display: flex; flex-wrap: wrap; gap: 0.3rem;
    margin-bottom: 0.8rem;
  }
  .muscle-tag {
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 2px;
    font-size: 0.7rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .workout-card .wc-meta {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .workout-card .wc-actions {
    position: absolute;
    top: 1rem; right: 1rem;
    display: flex; gap: 0.4rem;
    opacity: 0;
    transition: opacity .2s;
  }
  .workout-card:hover .wc-actions { opacity: 1; }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    text-align: center;
    padding: 5rem 2rem;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 4px;
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty-state h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  /* ─── MODAL ─── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 4px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 2rem;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .modal h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 1.8rem;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 0.6rem;
    margin-top: 1.5rem;
  }

  /* ─── FORMS ─── */
  .form-group { margin-bottom: 1.1rem; }
  label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  input, textarea, select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    padding: 0.65rem 0.9rem;
    outline: none;
    transition: border-color .2s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 72px; }

  .muscle-checkboxes {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
  }
  .muscle-checkboxes label {
    font-size: 0.72rem;
    letter-spacing: 1px;
    color: var(--muted);
    cursor: pointer;
    padding: 0.3rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 2px;
    transition: all .15s;
    margin: 0;
    text-transform: uppercase;
  }
  .muscle-checkboxes input[type="checkbox"] { display: none; }
  .muscle-checkboxes input[type="checkbox"]:checked + label {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  /* ─── WORKOUT DETAIL VIEW ─── */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    background: none;
    margin-bottom: 1.5rem;
    transition: color .2s;
  }
  .back-btn:hover { color: var(--text); }

  .workout-detail-header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.5rem;
    margin-bottom: 2rem;
  }
  .workout-detail-header h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 3rem;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  /* ─── EXERCISE BLOCK ─── */
  .exercise-block {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  .exercise-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.2rem;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
  }
  .exercise-block-header h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.2rem;
    text-transform: uppercase;
  }

  .sets-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  .sets-table th {
    background: var(--bg3);
    padding: 0.5rem 1.2rem;
    text-align: left;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .sets-table td {
    padding: 0.7rem 1.2rem;
    border-bottom: 1px solid var(--border);
  }
  .sets-table tr:last-child td { border-bottom: none; }
  .sets-table .set-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    color: var(--muted);
    width: 40px;
  }
  .sets-table .weight-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--accent);
  }

  /* ─── ADD EXERCISE FORM ─── */
  .add-exercise-form {
    background: var(--bg2);
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 1.4rem;
    margin-top: 1rem;
  }
  .add-exercise-form h4 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    text-transform: uppercase;
    margin-bottom: 1rem;
    color: var(--muted);
  }
  .sets-builder { display: flex; flex-direction: column; gap: 0.5rem; margin: 0.8rem 0; }
  .set-row {
    display: grid;
    grid-template-columns: 32px 1fr 1fr 80px auto;
    gap: 0.5rem;
    align-items: center;
  }
  .set-row .set-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
  }
  .set-row input { padding: 0.45rem 0.6rem; font-size: 0.9rem; }
  .set-row select { padding: 0.45rem 0.4rem; font-size: 0.9rem; }
  .remove-set-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    border-radius: 3px;
    padding: 0.35rem 0.5rem;
    font-size: 0.8rem;
    transition: all .15s;
  }
  .remove-set-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  /* ─── PR PAGE ─── */
  .pr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }
  .pr-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.2rem;
    position: relative;
    overflow: hidden;
  }
  .pr-card::after {
    content: 'PR';
    position: absolute;
    right: -8px; top: -4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 4rem;
    color: var(--accent);
    opacity: 0.06;
    line-height: 1;
  }
  .pr-card .pr-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }
  .pr-card .pr-weight {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 2.4rem;
    color: var(--accent);
    line-height: 1;
  }
  .pr-card .pr-weight span {
    font-size: 1rem;
    color: var(--muted);
    font-weight: 600;
  }
  .pr-card .pr-est {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }
  .pr-card .pr-date {
    font-size: 0.68rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--border);
    margin-top: 0.8rem;
  }

  /* ─── TOAST ─── */
  #toast {
    position: fixed;
    bottom: 2rem; right: 2rem;
    background: var(--success);
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 0.8rem 1.5rem;
    border-radius: 3px;
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all .3s cubic-bezier(.175,.885,.32,1.275);
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.pr { background: var(--accent); }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">Gym<span>Log</span></div>
  <nav>
    <button class="active" onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('workouts')">Workouts</button>
    <button onclick="showPage('prs')">PRs</button>
  </nav>
</header>

<main>
  <!-- ═══ DASHBOARD ═══ -->
  <div id="page-dashboard" class="page active">
    <div class="stats-bar" id="stats-bar">
      <div class="stat-item"><div class="val" id="s-workouts">—</div><div class="lbl">Total Sessions</div></div>
      <div class="stat-item"><div class="val" id="s-week">—</div><div class="lbl">This Week</div></div>
      <div class="stat-item"><div class="val" id="s-exercises">—</div><div class="lbl">Exercises Logged</div></div>
      <div class="stat-item"><div class="val" id="s-prs">—</div><div class="lbl">Personal Records</div></div>
      <div class="stat-item"><div class="val" id="s-volume">—</div><div class="lbl">Total Volume (kg)</div></div>
    </div>

    <div class="section-header">
      <div class="section-title">Recent <span>Sessions</span></div>
      <button class="btn btn-primary" onclick="openNewWorkoutModal()">+ New Session</button>
    </div>
    <div id="recent-workouts" class="workouts-grid"></div>
  </div>

  <!-- ═══ WORKOUTS PAGE ═══ -->
  <div id="page-workouts" class="page">
    <!-- list view -->
    <div id="workouts-list-view">
      <div class="section-header">
        <div class="section-title">All <span>Sessions</span></div>
        <button class="btn btn-primary" onclick="openNewWorkoutModal()">+ New Session</button>
      </div>
      <div id="all-workouts" class="workouts-grid"></div>
    </div>

    <!-- detail view -->
    <div id="workout-detail-view" style="display:none">
      <button class="back-btn" onclick="closeDetailView()">← Back to sessions</button>
      <div class="workout-detail-header">
        <div id="detail-date" style="font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem"></div>
        <h1 id="detail-name"></h1>
        <div id="detail-muscles" class="wc-muscles" style="margin-top:.5rem"></div>
        <div id="detail-notes" style="color:var(--muted);font-size:.9rem;margin-top:.5rem"></div>
      </div>

      <div class="section-header">
        <div class="section-title">Exercises</div>
        <button class="btn btn-primary btn-sm" onclick="toggleAddExerciseForm()">+ Add Exercise</button>
      </div>

      <div id="exercises-container"></div>

      <!-- add exercise inline form -->
      <div id="add-exercise-form" class="add-exercise-form" style="display:none">
        <h4>New Exercise</h4>
        <div class="form-group">
          <label>Exercise Name</label>
          <input type="text" id="ex-name" placeholder="e.g. Bench Press, Squat…" list="exercise-suggestions"/>
          <datalist id="exercise-suggestions">
            <option value="Bench Press"/><option value="Squat"/><option value="Deadlift"/>
            <option value="Overhead Press"/><option value="Pull Up"/><option value="Barbell Row"/>
            <option value="Incline Bench Press"/><option value="Romanian Deadlift"/>
            <option value="Leg Press"/><option value="Dumbbell Curl"/><option value="Tricep Pushdown"/>
            <option value="Lateral Raise"/><option value="Face Pull"/><option value="Hip Thrust"/>
            <option value="Bulgarian Split Squat"/><option value="Cable Fly"/>
          </datalist>
        </div>
        <div>
          <label>Sets</label>
          <div class="sets-builder" id="sets-builder"></div>
          <button class="btn btn-ghost btn-sm" style="margin-top:.5rem" onclick="addSetRow()">+ Add Set</button>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="toggleAddExerciseForm()">Cancel</button>
          <button class="btn btn-primary" onclick="submitExercise()">Save Exercise</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ PR PAGE ═══ -->
  <div id="page-prs" class="page">
    <div class="section-header">
      <div class="section-title">Personal <span>Records</span></div>
    </div>
    <p style="color:var(--muted);font-size:.9rem;margin-bottom:1.5rem">
      PRs are auto-tracked using the Epley formula to estimate your 1-rep max from any set.
    </p>
    <div id="pr-grid" class="pr-grid"></div>
  </div>
</main>

<!-- ═══ NEW WORKOUT MODAL ═══ -->
<div class="modal-overlay" id="new-workout-modal">
  <div class="modal">
    <h2 id="modal-title">New Session</h2>
    <div class="form-group">
      <label>Session Name</label>
      <input type="text" id="w-name" placeholder="e.g. Push Day A, Leg Day…"/>
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="w-date"/>
    </div>
    <div class="form-group">
      <label>Muscle Groups</label>
      <div class="muscle-checkboxes">
        <input type="checkbox" id="m-chest" value="Chest"><label for="m-chest">Chest</label>
        <input type="checkbox" id="m-back" value="Back"><label for="m-back">Back</label>
        <input type="checkbox" id="m-shoulders" value="Shoulders"><label for="m-shoulders">Shoulders</label>
        <input type="checkbox" id="m-legs" value="Legs"><label for="m-legs">Legs</label>
        <input type="checkbox" id="m-arms" value="Arms"><label for="m-arms">Arms</label>
        <input type="checkbox" id="m-core" value="Core"><label for="m-core">Core</label>
        <input type="checkbox" id="m-glutes" value="Glutes"><label for="m-glutes">Glutes</label>
        <input type="checkbox" id="m-cardio" value="Cardio"><label for="m-cardio">Cardio</label>
      </div>
    </div>
    <div class="form-group">
      <label>Notes (optional)</label>
      <textarea id="w-notes" placeholder="How did it feel? Any PR attempts?"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveWorkout()">Save Session</button>
    </div>
  </div>
</div>

<div id="toast">✓ Saved</div>

<script>
const API = '';
let currentWorkoutId = null;
let editingWorkoutId = null;

// ─── NAV ───
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('nav button')[['dashboard','workouts','prs'].indexOf(name)].classList.add('active');

  if (name === 'dashboard') { loadStats(); loadRecentWorkouts(); }
  if (name === 'workouts')  { closeDetailView(); loadAllWorkouts(); }
  if (name === 'prs')       { loadPRs(); }
}

// ─── STATS ───
async function loadStats() {
  const s = await fetch('/api/stats').then(r => r.json());
  document.getElementById('s-workouts').textContent = s.totalWorkouts;
  document.getElementById('s-week').textContent = s.recentWorkouts;
  document.getElementById('s-exercises').textContent = s.totalExercises;
  document.getElementById('s-prs').textContent = s.totalPRs;
  const vol = s.totalVolume >= 1000 ? (s.totalVolume/1000).toFixed(1)+'k' : s.totalVolume;
  document.getElementById('s-volume').textContent = vol;
}

// ─── FORMAT DATE ───
function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
}

// ─── WORKOUT CARD HTML ───
function workoutCardHTML(w, exCount) {
  const muscles = (w.muscleGroups||[]).map(m => `<span class="muscle-tag">${m}</span>`).join('');
  return `
    <div class="workout-card" onclick="openWorkoutDetail('${w._id}')">
      <div class="wc-actions">
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEditModal('${w._id}')">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteWorkout('${w._id}')">Del</button>
      </div>
      <div class="wc-date">${fmtDate(w.date)}</div>
      <div class="wc-name">${escHtml(w.name)}</div>
      <div class="wc-muscles">${muscles}</div>
      <div class="wc-meta">${exCount} exercise${exCount!==1?'s':''}</div>
    </div>`;
}

// ─── LOAD WORKOUTS ───
async function loadRecentWorkouts() {
  const workouts = await fetch('/api/workouts').then(r => r.json());
  const recent = workouts.slice(0, 6);
  const el = document.getElementById('recent-workouts');
  if (!recent.length) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="icon">🏋️</div>
      <h3>No sessions yet</h3>
      <p>Hit "+ New Session" to log your first workout.</p>
    </div>`;
    return;
  }
  const cards = await Promise.all(recent.map(async w => {
    const exs = await fetch(`/api/workouts/${w._id}/exercises`).then(r => r.json());
    return workoutCardHTML(w, exs.length);
  }));
  el.innerHTML = cards.join('');
}

async function loadAllWorkouts() {
  const workouts = await fetch('/api/workouts').then(r => r.json());
  const el = document.getElementById('all-workouts');
  if (!workouts.length) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="icon">🏋️</div><h3>No sessions logged</h3>
      <p>Start your first session above.</p>
    </div>`;
    return;
  }
  const cards = await Promise.all(workouts.map(async w => {
    const exs = await fetch(`/api/workouts/${w._id}/exercises`).then(r => r.json());
    return workoutCardHTML(w, exs.length);
  }));
  el.innerHTML = cards.join('');
}

// ─── WORKOUT MODAL ───
function openNewWorkoutModal() {
  editingWorkoutId = null;
  document.getElementById('modal-title').textContent = 'New Session';
  document.getElementById('w-name').value = '';
  document.getElementById('w-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('w-notes').value = '';
  document.querySelectorAll('.muscle-checkboxes input').forEach(cb => cb.checked = false);
  document.getElementById('new-workout-modal').classList.add('open');
}

async function openEditModal(id) {
  const w = await fetch(`/api/workouts/${id}`).then(r => r.json());
  editingWorkoutId = id;
  document.getElementById('modal-title').textContent = 'Edit Session';
  document.getElementById('w-name').value = w.name;
  document.getElementById('w-date').value = w.date;
  document.getElementById('w-notes').value = w.notes || '';
  document.querySelectorAll('.muscle-checkboxes input').forEach(cb => {
    cb.checked = (w.muscleGroups||[]).includes(cb.value);
  });
  document.getElementById('new-workout-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('new-workout-modal').classList.remove('open');
}

async function saveWorkout() {
  const name = document.getElementById('w-name').value.trim();
  const date = document.getElementById('w-date').value;
  if (!name || !date) { alert('Name and date are required.'); return; }
  const muscleGroups = [...document.querySelectorAll('.muscle-checkboxes input:checked')].map(cb => cb.value);
  const notes = document.getElementById('w-notes').value.trim();
  const body = { name, date, notes, muscleGroups };

  if (editingWorkoutId) {
    await fetch(`/api/workouts/${editingWorkoutId}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    showToast('Session updated');
  } else {
    await fetch('/api/workouts', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    showToast('Session created');
  }
  closeModal();
  loadStats();
  loadRecentWorkouts();
  loadAllWorkouts();
}

async function deleteWorkout(id) {
  if (!confirm('Delete this session and all its exercises?')) return;
  await fetch(`/api/workouts/${id}`, { method:'DELETE' });
  showToast('Session deleted');
  loadStats();
  loadRecentWorkouts();
  loadAllWorkouts();
  if (currentWorkoutId === id) closeDetailView();
}

// ─── DETAIL VIEW ───
async function openWorkoutDetail(id) {
  currentWorkoutId = id;
  const data = await fetch(`/api/workouts/${id}`).then(r => r.json());
  document.getElementById('workouts-list-view').style.display = 'none';
  document.getElementById('workout-detail-view').style.display = 'block';
  document.getElementById('detail-name').textContent = data.name;
  document.getElementById('detail-date').textContent = fmtDate(data.date);
  document.getElementById('detail-notes').textContent = data.notes || '';
  document.getElementById('detail-muscles').innerHTML = (data.muscleGroups||[]).map(m => `<span class="muscle-tag">${m}</span>`).join('');

  // switch to workouts page
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-workouts').classList.add('active');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('nav button')[1].classList.add('active');

  renderExercises(data.exercises || []);
  document.getElementById('add-exercise-form').style.display = 'none';
  initSetRows();
}

function closeDetailView() {
  currentWorkoutId = null;
  document.getElementById('workouts-list-view').style.display = 'block';
  document.getElementById('workout-detail-view').style.display = 'none';
  loadAllWorkouts();
}

function renderExercises(exercises) {
  const c = document.getElementById('exercises-container');
  if (!exercises.length) {
    c.innerHTML = `<div class="empty-state"><div class="icon">💪</div><h3>No exercises yet</h3><p>Add your first exercise above.</p></div>`;
    return;
  }
  c.innerHTML = exercises.map((ex, i) => {
    const rows = (ex.sets||[]).map((s, si) => `
      <tr>
        <td class="set-num">${si+1}</td>
        <td class="weight-val">${s.weight}<span style="font-size:.75rem;color:var(--muted);font-weight:400"> ${s.unit||'kg'}</span></td>
        <td>${s.reps} reps</td>
      </tr>`).join('');
    return `
      <div class="exercise-block">
        <div class="exercise-block-header">
          <h3>${escHtml(ex.name)}</h3>
          <button class="btn btn-danger btn-sm" onclick="deleteExercise('${ex._id}')">Remove</button>
        </div>
        <table class="sets-table">
          <thead><tr><th>#</th><th>Weight</th><th>Reps</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }).join('');
}

async function deleteExercise(id) {
  await fetch(`/api/exercises/${id}`, { method:'DELETE' });
  showToast('Exercise removed');
  refreshDetail();
}

async function refreshDetail() {
  if (!currentWorkoutId) return;
  const exs = await fetch(`/api/workouts/${currentWorkoutId}/exercises`).then(r => r.json());
  renderExercises(exs);
  loadStats();
}

// ─── ADD EXERCISE ───
let setCount = 0;

function initSetRows() {
  setCount = 0;
  document.getElementById('sets-builder').innerHTML = '';
  document.getElementById('ex-name').value = '';
  addSetRow(); addSetRow(); addSetRow();
}

function toggleAddExerciseForm() {
  const f = document.getElementById('add-exercise-form');
  const visible = f.style.display !== 'none';
  f.style.display = visible ? 'none' : 'block';
  if (!visible) initSetRows();
}

function addSetRow() {
  setCount++;
  const row = document.createElement('div');
  row.className = 'set-row';
  row.dataset.set = setCount;
  row.innerHTML = `
    <div class="set-label">${setCount}</div>
    <input type="number" placeholder="Weight" min="0" step="0.5" class="s-weight"/>
    <input type="number" placeholder="Reps" min="1" step="1" class="s-reps"/>
    <select class="s-unit"><option value="kg">kg</option><option value="lbs">lbs</option></select>
    <button class="remove-set-btn" onclick="removeSetRow(this)">✕</button>`;
  document.getElementById('sets-builder').appendChild(row);
}

function removeSetRow(btn) {
  const rows = document.querySelectorAll('.set-row');
  if (rows.length <= 1) return;
  btn.closest('.set-row').remove();
  // renumber
  document.querySelectorAll('.set-row').forEach((r, i) => {
    r.querySelector('.set-label').textContent = i + 1;
  });
}

async function submitExercise() {
  const name = document.getElementById('ex-name').value.trim();
  if (!name) { alert('Enter an exercise name.'); return; }

  const sets = [];
  document.querySelectorAll('.set-row').forEach(row => {
    const weight = row.querySelector('.s-weight').value;
    const reps   = row.querySelector('.s-reps').value;
    const unit   = row.querySelector('.s-unit').value;
    // edge case: skip empty rows (line 186 server.js also validates)
    if (weight && reps) sets.push({ weight: parseFloat(weight), reps: parseInt(reps), unit });
  });

  if (!sets.length) { alert('Enter at least one complete set (weight + reps).'); return; }

  const res = await fetch(`/api/workouts/${currentWorkoutId}/exercises`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, sets })
  });
  const data = await res.json();

  // check if it was a PR — server auto-updates PRs, we just signal it
  showToast('Exercise saved! Checking for PRs…');
  const prs = await fetch('/api/prs').then(r => r.json());
  const pr = prs.find(p => p.key === name.toLowerCase().trim());
  if (pr) {
    setTimeout(() => showToast(`🏆 PR on ${name}: ${pr.weight}${pr.unit} × ${pr.reps}`, true), 1200);
  }

  document.getElementById('add-exercise-form').style.display = 'none';
  refreshDetail();
  loadStats();
}

// ─── PRs ───
async function loadPRs() {
  const prs = await fetch('/api/prs').then(r => r.json());
  const el = document.getElementById('pr-grid');
  if (!prs.length) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="icon">🏆</div><h3>No PRs yet</h3>
      <p>Log exercises with weight & reps — PRs are tracked automatically.</p>
    </div>`;
    return;
  }
  el.innerHTML = prs.map(pr => `
    <div class="pr-card">
      <div class="pr-name">${escHtml(pr.exerciseName)}</div>
      <div class="pr-weight">${pr.weight}<span> ${pr.unit} × ${pr.reps} reps</span></div>
      <div class="pr-est">Est. 1RM: <strong style="color:var(--accent)">${pr.estimated1RM} ${pr.unit}</strong></div>
      <div class="pr-date">${new Date(pr.updatedAt).toLocaleDateString()}</div>
    </div>`).join('');
}

// ─── TOAST ───
function showToast(msg, isPR = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isPR ? 'show pr' : 'show';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 3000);
}

// ─── UTILS ───
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── INIT ───
document.getElementById('new-workout-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

loadStats();
loadRecentWorkouts();
</script>
</body>
</html>
